[project]
name = "matchbook"
version = "0.1.0"
description = "Agentic purchase-to-pay process mining on open data"
readme = "README.md"
requires-python = ">=3.12"

# PyYAML is the only runtime dependency, and it is here solely to read the
# facts sheet. Everything else -- XES parsing, the log representation,
# discovery, conformance, rendering, the agent, the span store, the bridge --
# is standard library.
#
# No optional groups are declared, deliberately. An earlier version declared an
# `agent` extra of five packages (anthropic, opentelemetry-sdk, fastapi,
# uvicorn, rank-bm25) and a `fast` extra of numpy, and NOT ONE of them was
# imported anywhere: `uv sync --extra agent` installed five dependencies to no
# effect. A dependency is declared when something imports it. The live model
# adapter and the HTTP endpoint will each bring their own.
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `server` was listed here before it existed, and it is not a package. Add a
# directory to this list when it has an __init__.py and code in it.
packages = ["process", "bridge", "agent", "observability", "seed", "logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
